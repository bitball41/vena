<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Vena Demo</title>
		<style>
html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}
body {
	color: #f3ead2;
	background-color: #100c15;
	overflow: hidden;
	touch-action: none;
	font-family: "Palatino Linotype", Palatino, "Times New Roman", serif;
	display: flex;
	align-items: center;
	justify-content: center;
}
#wrap {
	width: 100vw;
	height: 100vh;
	position: relative;
}
#canvas {
	display: block;
	width: 100%;
	height: 100%;
	image-rendering: pixelated;
	image-rendering: crisp-edges;
}
#canvas:focus {
	outline: none;
}
#status {
	position: fixed;
	inset: 0;
	background:
		radial-gradient(ellipse at 50% 38%, #4a1824 0%, #1a0c14 48%, #100c15 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: visible;
	gap: 18px;
	z-index: 2;
}
#status-splash {
	max-height: 46%;
	max-width: 72%;
	object-fit: contain;
	filter: drop-shadow(0 0 28px rgba(168, 24, 48, 0.45));
}
#status-progress {
	display: flex;
	flex-direction: column;
	align-items: stretch;
	width: min(440px, 74vw);
	gap: 10px;
	z-index: 3;
}
#status-percent {
	text-align: center;
	font-size: clamp(28px, 5vw, 42px);
	font-weight: 700;
	letter-spacing: 0.14em;
	color: #f3ead2;
	text-shadow: 0 0 18px rgba(200, 40, 60, 0.45);
	font-variant-numeric: tabular-nums;
}
#status-track {
	height: 16px;
	border: 2px solid #c9b896;
	background: #14080e;
	box-shadow: 0 0 16px rgba(140, 20, 40, 0.35), inset 0 0 8px #000;
	overflow: hidden;
	position: relative;
}
#status-fill {
	position: relative;
	height: 100%;
	width: 0%;
	background: linear-gradient(180deg, #ff7a72 0%, #c42838 42%, #6e121c 100%);
	box-shadow: inset 0 0 10px rgba(255, 180, 180, 0.45);
	transition: width 80ms linear;
}
#status-fill::after {
	content: "";
	position: absolute;
	inset: 0;
	background: repeating-linear-gradient(
		-55deg,
		transparent 0 8px,
		rgba(255, 255, 255, 0.06) 8px 12px
	);
	pointer-events: none;
}
#status-label {
	text-align: center;
	font-size: 14px;
	letter-spacing: 0.08em;
	color: #c9b896;
	text-transform: uppercase;
}
#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
#fps-graph {
	position: fixed;
	top: 10px;
	left: 10px;
	width: 160px;
	height: 56px;
	background: rgba(0, 0, 0, 0.72);
	border-radius: 6px;
	padding: 6px;
	z-index: 9;
	display: none;
}
#fps-canvas {
	width: 100%;
	height: 100%;
	display: block;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
	</head>
	<body>
		<div id="wrap">
			<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		</div>
		<noscript>Your browser does not support JavaScript.</noscript>
		<div id="status">
			<img id="status-splash" class="fullsize--true" src="index.png" alt="Vena">
			<div id="status-progress">
				<div id="status-percent">0%</div>
				<div id="status-track"><div id="status-fill"></div></div>
				<div id="status-label">Loading VENA…</div>
			</div>
			<div id="status-notice"></div>
		</div>
		<div id="fps-graph"><canvas id="fps-canvas" width="148" height="44"></canvas></div>
		<script>
window.VENA_LAUNCH = {
	base: "",
	executable: "index",
	pckBytes: 154862524,
	pckParts: 8,
	wasmBytes: 1508095,
	sideWasmBytes: 44072184,
	sideWasmParts: 3,
	renderCap: { w: 960, h: 540 },
};
		</script>
		<script src="index.js?v=real50"></script>
		<script src="vena-boot.js?v=real50"></script>
	</body>
</html>
