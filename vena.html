<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Vena Demo</title>
		<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body {
	color: #222;
	background: #c0c0c0;
	overflow: hidden;
	touch-action: none;
	font-family: sans-serif;
	display: flex;
	align-items: center;
	justify-content: center;
}
#wrap {
	width: 100vw;
	height: 100vh;
	position: relative;
}
#canvas {
	display: block;
	width: 100%;
	height: 100%;
	image-rendering: pixelated;
}
#canvas:focus { outline: none; }
#status {
	position: fixed;
	inset: 0;
	background: #c0c0c0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: visible;
	z-index: 2;
}
#status-progress {
	display: flex;
	flex-direction: column;
	align-items: stretch;
	width: min(420px, 70vw);
}
#bar {
	height: 18px;
	background: #e0e0e0;
	border: 1px solid #808080;
}
#status-fill {
	height: 100%;
	width: 0%;
	background: #808080;
}
#status-label {
	margin-top: 10px;
	font-size: 14px;
	color: #222;
	text-align: center;
}
#status-notice {
	display: none;
	margin-top: 12px;
	color: #400;
	text-align: center;
}
		</style>
		<link id="vena-icon" rel="icon" type="image/png" href="assets/index.icon.png">
		<link id="vena-apple" rel="apple-touch-icon" href="assets/index.apple-touch-icon.png">
	</head>
	<body>
		<div id="wrap">
			<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		</div>
		<noscript>Your browser does not support JavaScript.</noscript>
		<div id="status">
			<div id="status-progress">
				<div id="bar"><div id="status-fill"></div></div>
				<div id="status-label">0%</div>
			</div>
			<div id="status-notice"></div>
		</div>
		<script>
const CDN = "https://cdn.jsdelivr.net/gh/bitball41/vena@7a30dea99ad67572dc055e13dc742d40c00d5d25/";
const HOSTED = location.protocol !== "file:" && location.hostname.indexOf("jsdelivr") === -1;
const ROOT = HOSTED ? "" : CDN;
const PKG = ROOT + "packages/";
const ASSETS = ROOT + "assets/";
document.getElementById("vena-icon").href = ASSETS + "index.icon.png";
document.getElementById("vena-apple").href = ASSETS + "index.apple-touch-icon.png";
window.VENA_LAUNCH = {
	base: PKG,
	executable: PKG + "index",
	workletBase: PKG,
	pckBytes: 154862663,
	pckParts: 8,
	wasmBytes: 1508095,
	sideWasmBytes: 44072184,
	sideWasmParts: 3,
	renderCap: { w: 960, h: 540 },
};
document.write('<script src="' + PKG + 'index.js"><\/script>');
document.write('<script src="' + ROOT + 'vena-boot.js"><\/script>');
		</script>
	</body>
</html>
